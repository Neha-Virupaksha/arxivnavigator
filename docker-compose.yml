services:
  postgres:
    image: postgres:16
    container_name: arxivnav-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: arxivnav-api
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      # host.docker.internal lets the container reach Ollama running on your Mac host
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      HF_HUB_OFFLINE: "1"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hf_cache:/root/.cache/huggingface

  dashboard:
    build: .
    container_name: arxivnav-dashboard
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      API_URL: http://api:8000
    command: ["streamlit", "run", "dashboard/app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    ports:
      - "8501:8501"
    depends_on:
      - api
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
  hf_cache:
